<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOA - Daily Tarot</title>
    <meta property="og:title" content="NOA - Daily Tarot">
    <meta property="og:description" content="本日の運勢を占う">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/tarot.css">
</head>

<body>
    <div class="stars-bg"></div>

    <main class="container tarot-container">
        <header class="site-header">
            <div class="logo-container">
                <a href="/">
                    <img src="/images/logo_final.png" alt="NOA Logo" class="logo">
                </a>
            </div>

            <p class="subtitle">本日の運勢</p>
        </header>

        <div class="tarot-stage">
            <div class="card-deck" id="card-deck">
                <!-- Deck text or visual -->
                <div class="deck-placeholder">
                    <div class="card-back">
                        <div class="card-pattern"></div>
                    </div>
                    <div class="card-glow"></div>
                </div>
                <p class="instruction">心を落ち着かせて<br>カードをタップしてください</p>
            </div>

            <!-- Result Card Container (Hidden initially) -->
            <div id="result-container" class="result-container hidden">
                <div class="card-display" id="result-card">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-visual">
                                <span class="card-number" id="card-number"></span>
                                <span class="card-symbol"></span>
                            </div>
                            <div class="card-text-overlay" style="position: absolute; bottom: 0; left: 0; width: 100%; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 70%, transparent 100%); padding: 1.5rem 0 0.8rem 0; border-radius: 0 0 8px 8px;">
                                <h3 class="card-caption" id="card-name"></h3>
                                <p class="card-caption-ja" id="card-name-js"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="result-content">
                    <h2 class="result-keyword" id="result-keyword"></h2>
                    <p class="result-message" id="result-message"></p>

                    <div class="lucky-section">
                        <div class="lucky-title">NOAで更なる運気アップ！</div>
                        <div class="lucky-item" id="result-lucky">Loading...</div>
                    </div>

                    <!-- Retry button removed -->
                    <a href="/" class="home-btn">トップへ戻る</a>
                </div>
            </div>
        </div>

    </main>

    <!-- Complete Modal -->
    <div id="complete-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 5000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <!-- オーブ描画用キャンバス -->
        <canvas id="orb-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></canvas>
        
        <div style="position: relative; z-index: 2; max-width: 90%; width: 400px; cursor: pointer; transition: transform 0.3s ease;" onclick="closeCompleteModal()" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
            <img src="/images/master_modal_bg.png" alt="NOA MASTER" style="width: 100%; display: block; mix-blend-mode: screen;">
        </div>
    </div>

    <script src="/fireflies.js"></script>
    <script src="/js/tarot-data.js"></script>
    <script src="/js/tarot.js"></script>
</body>

</html>
